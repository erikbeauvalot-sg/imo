<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMV — connexion</title>
<style>
  :root { --bg: #f4f6fa; --panel: #ffffff; --text: #1d2433; --muted: #667085; --line: #e3e7ef; --accent: #1f6feb; --accent-text: #ffffff; --bad: #cf222e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f141c; --panel: #171d27; --text: #e6e9ef; --muted: #98a2b3; --line: #2a3240; --accent: #4c8dff; --accent-text: #0b1020; --bad: #ff6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
  form { width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  p { margin: 0 0 12px; color: var(--muted); }
  label { display: block; margin: 10px 0 3px; color: var(--muted); font-size: 12px; }
  input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  button { width: 100%; margin-top: 16px; padding: 9px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text); font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .error { color: var(--bad); font-size: 13px; margin-top: 10px; min-height: 1em; }
</style>
</head>
<body>
<form id="form">
  <h1>IMV</h1>
  <p>Agents en réunion</p>
  <label for="username">Identifiant</label>
  <input id="username" autocomplete="username" required autofocus>
  <label for="password">Mot de passe</label>
  <input id="password" type="password" autocomplete="current-password" required>
  <button id="submit">Se connecter</button>
  <div class="error" id="error"></div>
</form>
<script>
const $ = (id) => document.getElementById(id);
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("error").textContent = "";
  $("submit").disabled = true;
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("username").value.trim(), password: $("password").value }),
    });
    if (res.ok) { location.replace("/"); return; }
    const body = await res.json().catch(() => ({}));
    $("error").textContent = typeof body.detail === "string" ? body.detail : "Connexion impossible";
    $("password").select();
  } catch (err) {
    $("error").textContent = err.message;
  } finally {
    $("submit").disabled = false;
  }
});
</script>
</body>
</html>
