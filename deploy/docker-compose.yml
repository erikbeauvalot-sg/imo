# IMV en ligne : Traefik (HTTPS Let's Encrypt) devant le serveur IMV. Mode d'emploi : deploy/README.md
# Variables dans deploy/.env (modèle : deploy/.env.example).
name: imv

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    # Réseau de l'hôte : Traefik joint aussi les services de l'hôte en écoute sur 127.0.0.1
    # (deploy/traefik/*.yml) et voit l'adresse IP réelle des visiteurs, en IPv4 comme en IPv6.
    network_mode: host
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:${HTTP_PORT:-80}
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:${HTTPS_PORT:-443}
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?ACME_EMAIL manquant dans deploy/.env}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --accesslog=true
      # Métriques Prometheus, publiées seulement par une route déclarée (traefik/supervision.yml.example)
      - --metrics.prometheus=true
      - --metrics.prometheus.manualrouting=true
      - --metrics.prometheus.addrouterslabels=true
      # Services de l'hôte pour le conteneur IMV seul (ex. API de l'agent Hermes) : écoute sur la
      # passerelle du réseau privé d'IMV, injoignable d'Internet ; routes : traefik/hermes-api.yml.example.
      - --entrypoints.hote-imv.address=172.30.0.1:8642
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
      - ./traefik:/etc/traefik/dynamic:ro  # services de l'hôte (voir traefik/hote.yml.example)

  imv:
    build: ..
    image: imv:latest
    pull_policy: build
    restart: unless-stopped
    # Pas de port publié : seul Traefik joint IMV, par son adresse sur le réseau Docker.
    command:
      - serve
      - --auth
      - --host=0.0.0.0
      - --allowed-host=${IMV_DOMAIN:?IMV_DOMAIN manquant dans deploy/.env}
    env_file: .env  # IMV_LLM : fournisseur LLM proposé par défaut (vide : pas d'analyse)
    environment:
      TZ: ${TZ:-Europe/Paris}  # heures affichées dans les résumés
      # En-têtes X-Forwarded-* de Traefik acceptés (schéma https : cookie Secure). Sans risque :
      # le conteneur n'est joignable que depuis le VPS (réseau Docker, aucun port publié).
      FORWARDED_ALLOW_IPS: "*"
      # Agent Hermes du VPS (imv hermes <tâche>, LLM « hermes »), joint par Traefik ; clé : HERMES_API_KEY
      HERMES_API_URL: ${HERMES_API_URL:-http://172.30.0.1:8642/p/oscar/v1}
    volumes:
      - ./data:/data  # base, captures, contexte.md (appartenant à l'uid 1001)
    shm_size: 1gb  # Chromium : un navigateur par réunion
    init: true
    stop_grace_period: 60s  # le temps que chaque agent dise au revoir et quitte sa réunion
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8765/login"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.imv.rule=Host(`${IMV_DOMAIN}`)
      - traefik.http.routers.imv.entrypoints=websecure
      - traefik.http.routers.imv.tls.certresolver=le
      - traefik.http.routers.imv.middlewares=imv-headers
      - traefik.http.services.imv.loadbalancer.server.port=8765
      - traefik.http.middlewares.imv-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.imv-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.imv-headers.headers.frameDeny=true
      - traefik.http.middlewares.imv-headers.headers.referrerPolicy=same-origin
    networks: [web]

networks:
  web:
    # Sous-réseau fixe : sa passerelle (172.30.0.1) porte le point d'entrée Traefik « hote-imv »
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
